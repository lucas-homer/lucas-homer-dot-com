<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Cartography</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '\2022';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 52px;
            text-align: right;
        }

        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 80px 0;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Quiet Cartography</h1>
            <div class="subtitle">Fractal terrain births branching growth &mdash; invisible landscapes revealed through organic accumulation</div>

            <!-- Seed Section (FIXED) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&#8635; Random</button>
            </div>

            <!-- Parameters Section (CUSTOM) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Growth Sources</label>
                    <div class="slider-container">
                        <input type="range" id="growthSources" min="2" max="15" step="1" value="7" oninput="updateParam('growthSources', this.value)">
                        <span class="value-display" id="growthSources-value">7</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Max Depth</label>
                    <div class="slider-container">
                        <input type="range" id="maxDepth" min="3" max="10" step="1" value="7" oninput="updateParam('maxDepth', this.value)">
                        <span class="value-display" id="maxDepth-value">7</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Branch Decay</label>
                    <div class="slider-container">
                        <input type="range" id="branchDecay" min="0.50" max="0.90" step="0.01" value="0.73" oninput="updateParam('branchDecay', this.value)">
                        <span class="value-display" id="branchDecay-value">0.73</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Terrain Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.010" step="0.0005" value="0.0035" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.0035</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Perturbation</label>
                    <div class="slider-container">
                        <input type="range" id="perturbation" min="0.05" max="0.80" step="0.05" value="0.35" oninput="updateParam('perturbation', this.value)">
                        <span class="value-display" id="perturbation-value">0.35</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Terrain Influence</label>
                    <div class="slider-container">
                        <input type="range" id="terrainInfluence" min="0.10" max="0.90" step="0.05" value="0.55" oninput="updateParam('terrainInfluence', this.value)">
                        <span class="value-display" id="terrainInfluence-value">0.55</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Growth Speed</label>
                    <div class="slider-container">
                        <input type="range" id="growthSpeed" min="2" max="60" step="1" value="18" oninput="updateParam('growthSpeed', this.value)">
                        <span class="value-display" id="growthSpeed-value">18</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Terrain Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="terrainOpacity" min="0.00" max="0.30" step="0.01" value="0.08" oninput="updateParam('terrainOpacity', this.value)">
                        <span class="value-display" id="terrainOpacity-value">0.08</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (CUSTOM) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Root</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#1a0f07" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#1a0f07</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Branch</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#5c3a1e" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#5c3a1e</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Tip</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#7a8b5d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#7a8b5d</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (FIXED) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="regenerate()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()" style="margin-top:8px">Download PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing growth system...</div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // PARAMETERS
        // =====================================================================

        let params = {
            seed: 42,
            growthSources: 7,
            maxDepth: 7,
            branchLength: 32,
            branchDecay: 0.73,
            noiseScale: 0.0035,
            perturbation: 0.35,
            terrainInfluence: 0.55,
            growthSpeed: 18,
            terrainOpacity: 0.08,
            colorPalette: ['#1a0f07', '#5c3a1e', '#7a8b5d']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // =====================================================================
        // STATE
        // =====================================================================

        let activeTips = [];
        let growthComplete = false;
        let terrainGrid;
        let gridRes = 4;
        let gridCols, gridRows;
        let bgColor;

        // =====================================================================
        // TERRAIN COMPUTATION
        // =====================================================================

        function computeTerrainValue(x, y) {
            let val = 0;
            let amp = 1;
            let freq = params.noiseScale;
            let totalAmp = 0;
            for (let o = 0; o < 5; o++) {
                val += amp * noise(x * freq + 1000, y * freq + 2000);
                totalAmp += amp;
                amp *= 0.5;
                freq *= 2;
            }
            return val / totalAmp;
        }

        function precomputeTerrain() {
            gridCols = ceil(1200 / gridRes) + 2;
            gridRows = ceil(1200 / gridRes) + 2;
            terrainGrid = new Float32Array(gridCols * gridRows);
            for (let j = 0; j < gridRows; j++) {
                for (let i = 0; i < gridCols; i++) {
                    terrainGrid[i + j * gridCols] = computeTerrainValue(i * gridRes, j * gridRes);
                }
            }
        }

        function getTerrainAt(x, y) {
            let gx = x / gridRes;
            let gy = y / gridRes;
            let i = floor(gx);
            let j = floor(gy);
            let fx = gx - i;
            let fy = gy - j;
            i = constrain(i, 0, gridCols - 2);
            j = constrain(j, 0, gridRows - 2);
            let v00 = terrainGrid[i + j * gridCols];
            let v10 = terrainGrid[(i + 1) + j * gridCols];
            let v01 = terrainGrid[i + (j + 1) * gridCols];
            let v11 = terrainGrid[(i + 1) + (j + 1) * gridCols];
            return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
        }

        function getTerrainGradient(x, y) {
            let eps = gridRes;
            let dx = getTerrainAt(x + eps, y) - getTerrainAt(x - eps, y);
            let dy = getTerrainAt(x, y + eps) - getTerrainAt(x, y - eps);
            return createVector(dx, dy);
        }

        // =====================================================================
        // TERRAIN VISUALIZATION
        // =====================================================================

        function drawTerrain() {
            if (params.terrainOpacity < 0.005) return;

            let step = 5;
            let baseAlpha = params.terrainOpacity * 255;

            for (let x = 0; x < 1200; x += step) {
                for (let y = 0; y < 1200; y += step) {
                    let grad = getTerrainGradient(x, y);
                    let slopeMag = grad.mag();

                    if (slopeMag > 0.004) {
                        let gn = grad.copy().normalize();
                        let cx = -gn.y;
                        let cy = gn.x;
                        let len = min(slopeMag * 500, step * 0.45);
                        let alpha = baseAlpha * min(slopeMag * 25, 1);

                        stroke(165, 158, 140, alpha);
                        strokeWeight(0.4);
                        line(x - cx * len, y - cy * len, x + cx * len, y + cy * len);
                    }
                }
            }
        }

        // =====================================================================
        // GROWTH SOURCE PLACEMENT
        // =====================================================================

        function placeGrowthSources() {
            let sources = [];
            let attempts = 0;
            let maxAttempts = params.growthSources * 300;

            while (sources.length < params.growthSources && attempts < maxAttempts) {
                let x = random(120, 1080);
                let y = random(120, 1080);
                let t = getTerrainAt(x, y);

                // Prefer moderate-to-low terrain values
                let fitness = 1 - abs(t - 0.38) * 2.5;
                fitness = max(0.05, fitness);

                if (random() < fitness) {
                    let tooClose = false;
                    let minDist = 1200 / (params.growthSources * 0.7 + 1);
                    for (let s of sources) {
                        if (dist(x, y, s.x, s.y) < minDist) {
                            tooClose = true;
                            break;
                        }
                    }
                    if (!tooClose) {
                        sources.push({ x: x, y: y, terrain: t });
                    }
                }
                attempts++;
            }

            // Fallback
            while (sources.length < params.growthSources) {
                let x = random(150, 1050);
                let y = random(150, 1050);
                sources.push({ x: x, y: y, terrain: getTerrainAt(x, y) });
            }

            return sources;
        }

        // =====================================================================
        // COLOR FUNCTIONS
        // =====================================================================

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 26, g: 15, b: 7 };
        }

        function getColorForDepth(t, x, y) {
            let c1 = hexToRgb(params.colorPalette[0]);
            let c2 = hexToRgb(params.colorPalette[1]);
            let c3 = hexToRgb(params.colorPalette[2]);

            let r, g, b;
            if (t < 0.45) {
                let lt = t / 0.45;
                lt = lt * lt * (3 - 2 * lt);
                r = lerp(c1.r, c2.r, lt);
                g = lerp(c1.g, c2.g, lt);
                b = lerp(c1.b, c2.b, lt);
            } else {
                let lt = (t - 0.45) / 0.55;
                lt = lt * lt * (3 - 2 * lt);
                r = lerp(c2.r, c3.r, lt);
                g = lerp(c2.g, c3.g, lt);
                b = lerp(c2.b, c3.b, lt);
            }

            // Subtle terrain-based hue shift
            let tv = getTerrainAt(x, y);
            let shift = (tv - 0.5) * 12;
            r = constrain(r + shift, 0, 255);
            g = constrain(g + shift * 0.6, 0, 255);
            b = constrain(b + shift * 0.3, 0, 255);

            return color(r, g, b);
        }

        // =====================================================================
        // BRANCH TIP CLASS
        // =====================================================================

        class BranchTip {
            constructor(x, y, angle, depth, sourceIdx) {
                this.pos = createVector(x, y);
                this.angle = angle;
                this.depth = depth;
                this.sourceIdx = sourceIdx;
                this.alive = true;
                this.segmentsGrown = 0;
                this.maxSegments = max(2, floor(random(3, 7 - depth * 0.4)));
            }

            grow() {
                if (!this.alive) return [];

                let newTips = [];
                let segLen = params.branchLength * pow(params.branchDecay, this.depth);

                // Terrain gradient at current position
                let grad = getTerrainGradient(this.pos.x, this.pos.y);
                let gradMag = grad.mag();

                // Contour direction (perpendicular to gradient)
                let contourDir;
                if (gradMag > 0.001) {
                    let gn = grad.copy().normalize();
                    let c1 = createVector(-gn.y, gn.x);
                    let c2 = createVector(gn.y, -gn.x);
                    let currentDir = createVector(cos(this.angle), sin(this.angle));
                    contourDir = (p5.Vector.dot(c1, currentDir) > 0) ? c1 : c2;
                } else {
                    contourDir = createVector(cos(this.angle), sin(this.angle));
                }

                // Blend current heading with terrain contour
                let currentDir = createVector(cos(this.angle), sin(this.angle));
                let tw = params.terrainInfluence * (1 - this.depth / params.maxDepth * 0.35);

                let blended = p5.Vector.add(
                    currentDir.copy().mult(1 - tw),
                    contourDir.copy().mult(tw)
                );

                // Noise perturbation (increases gently with depth)
                let nv = noise(
                    this.pos.x * 0.007 + this.sourceIdx * 137,
                    this.pos.y * 0.007,
                    this.depth * 0.4
                );
                let perturbAngle = (nv - 0.5) * TWO_PI * params.perturbation * (1 + this.depth * 0.12);

                let finalAngle = atan2(blended.y, blended.x) + perturbAngle;

                // Subtle downhill bias for deeper branches
                if (this.depth > 2 && gradMag > 0.004) {
                    let gn = grad.copy().normalize();
                    let downhill = atan2(-gn.y, -gn.x);
                    let diff = finalAngle - downhill;
                    while (diff > PI) diff -= TWO_PI;
                    while (diff < -PI) diff += TWO_PI;
                    finalAngle -= diff * 0.08;
                }

                let newX = this.pos.x + cos(finalAngle) * segLen;
                let newY = this.pos.y + sin(finalAngle) * segLen;

                // Draw segment
                let depthRatio = this.depth / params.maxDepth;
                let weight = max(0.25, 2.2 * pow(params.branchDecay, this.depth * 0.65));
                let alpha = lerp(210, 40, depthRatio);
                let col = getColorForDepth(depthRatio, this.pos.x, this.pos.y);

                strokeWeight(weight);
                stroke(red(col), green(col), blue(col), alpha);
                noFill();

                // Organic curve for longer segments, straight for short
                if (segLen > 6) {
                    let nMid = noise(this.pos.x * 0.012, this.pos.y * 0.012, this.sourceIdx * 50);
                    let offset = (nMid - 0.5) * segLen * 0.35;
                    let perpX = -sin(finalAngle) * offset;
                    let perpY = cos(finalAngle) * offset;
                    let mx = (this.pos.x + newX) / 2 + perpX;
                    let my = (this.pos.y + newY) / 2 + perpY;
                    bezier(this.pos.x, this.pos.y, mx, my, mx, my, newX, newY);
                } else {
                    line(this.pos.x, this.pos.y, newX, newY);
                }

                this.pos.set(newX, newY);
                this.angle = finalAngle;
                this.segmentsGrown++;

                // Bounds check
                if (newX < -10 || newX > 1210 || newY < -10 || newY > 1210) {
                    this.alive = false;
                    return newTips;
                }

                // Branching decision
                if (this.segmentsGrown >= this.maxSegments && this.depth < params.maxDepth) {
                    let fertility = getTerrainAt(this.pos.x, this.pos.y);
                    let splitProb = 0.87 * pow(0.88, this.depth);
                    splitProb *= (0.45 + fertility * 0.7);
                    splitProb = min(splitProb, 0.95);

                    if (random() < splitProb) {
                        let baseAngle = random(PI / 7, PI / 3.2);
                        let variation = random(-0.12, 0.12);

                        newTips.push(new BranchTip(
                            newX, newY,
                            finalAngle - baseAngle + variation,
                            this.depth + 1,
                            this.sourceIdx
                        ));

                        newTips.push(new BranchTip(
                            newX, newY,
                            finalAngle + baseAngle - variation,
                            this.depth + 1,
                            this.sourceIdx
                        ));

                        // Main trunk continuation at low depth
                        if (random() < 0.4 * (1 - depthRatio)) {
                            newTips.push(new BranchTip(
                                newX, newY,
                                finalAngle + random(-0.08, 0.08),
                                this.depth,
                                this.sourceIdx
                            ));
                        }

                        // Draw junction node for main branches
                        if (this.depth <= 2) {
                            noStroke();
                            fill(red(col), green(col), blue(col), alpha * 0.4);
                            ellipse(newX, newY, weight * 2.5, weight * 2.5);
                        }

                        this.alive = false;
                    } else {
                        this.segmentsGrown = 0;
                        this.maxSegments = max(2, floor(random(2, 5)));
                    }
                }

                // Stochastic mortality (increases with depth)
                if (random() < 0.018 * this.depth) {
                    this.alive = false;
                    // Terminal mark
                    if (this.depth >= 3) {
                        noStroke();
                        fill(red(col), green(col), blue(col), alpha * 0.35);
                        ellipse(newX, newY, weight * 1.8, weight * 1.8);
                    }
                }

                // Terminal bud at max depth
                if (this.depth >= params.maxDepth - 1 && this.segmentsGrown >= this.maxSegments - 1) {
                    noStroke();
                    fill(red(col), green(col), blue(col), alpha * 0.3);
                    ellipse(newX, newY, weight * 2, weight * 2);
                }

                return newTips;
            }
        }

        // =====================================================================
        // P5.JS LIFECYCLE
        // =====================================================================

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';

            bgColor = color(248, 244, 236);
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            background(bgColor);

            precomputeTerrain();
            drawTerrain();

            let sources = placeGrowthSources();

            activeTips = [];
            growthComplete = false;

            for (let i = 0; i < sources.length; i++) {
                let s = sources[i];
                let numBranches = floor(random(3, 6));
                let baseAngle = random(TWO_PI);

                for (let b = 0; b < numBranches; b++) {
                    let angle = baseAngle + (TWO_PI / numBranches) * b + random(-0.35, 0.35);
                    activeTips.push(new BranchTip(s.x, s.y, angle, 0, i));
                }

                // Draw source mark
                let col = getColorForDepth(0, s.x, s.y);
                noStroke();
                fill(red(col), green(col), blue(col), 140);
                ellipse(s.x, s.y, 5, 5);
            }

            loop();
        }

        function draw() {
            if (growthComplete) return;

            // Adaptive budget: process more when queue is large
            let budget = max(params.growthSpeed, floor(activeTips.length / 18));
            budget = min(budget, 120); // cap for frame rate
            let newTips = [];
            let processed = 0;

            while (processed < budget && activeTips.length > 0) {
                let tip = activeTips.shift();
                if (!tip.alive) continue;

                let children = tip.grow();
                if (tip.alive) activeTips.push(tip);
                for (let c of children) newTips.push(c);
                processed++;
            }

            for (let t of newTips) activeTips.push(t);

            // Check for completion
            if (activeTips.length === 0) {
                growthComplete = true;
                noLoop();
            } else {
                // Cull dead tips to keep queue clean
                let alive = 0;
                for (let t of activeTips) {
                    if (t.alive) alive++;
                }
                if (alive === 0) {
                    growthComplete = true;
                    noLoop();
                }
            }
        }

        // =====================================================================
        // UI HANDLERS
        // =====================================================================

        function formatValue(name, value) {
            let v = parseFloat(value);
            if (name === 'noiseScale') return v.toFixed(4);
            if (['branchDecay', 'perturbation', 'terrainInfluence', 'terrainOpacity'].includes(name))
                return v.toFixed(2);
            return String(v);
        }

        function updateParam(name, value) {
            params[name] = parseFloat(value);
            document.getElementById(name + '-value').textContent = formatValue(name, value);
            initializeSystem();
        }

        function updateColor(colorId, value) {
            let idx = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function regenerate() {
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            updateUIFromParams();
            initializeSystem();
        }

        function updateUIFromParams() {
            let sliders = ['growthSources', 'maxDepth', 'branchDecay', 'noiseScale',
                           'perturbation', 'terrainInfluence', 'growthSpeed', 'terrainOpacity'];
            for (let id of sliders) {
                let el = document.getElementById(id);
                if (el) {
                    el.value = params[id];
                    document.getElementById(id + '-value').textContent = formatValue(id, params[id]);
                }
            }

            for (let i = 0; i < 3; i++) {
                let el = document.getElementById('color' + (i + 1));
                if (el) {
                    el.value = params.colorPalette[i];
                    document.getElementById('color' + (i + 1) + '-value').textContent = params.colorPalette[i];
                }
            }

            updateSeedDisplay();
        }

        function downloadPNG() {
            saveCanvas('quiet-cartography-' + params.seed, 'png');
        }

        // =====================================================================
        // SEED CONTROLS (FIXED)
        // =====================================================================

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
